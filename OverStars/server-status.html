<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Server Status</title>
</head>

<body>
    <style>
        body {
            background-color: rgb(62, 66, 75);
            color: white;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        server-status {
            background-color: rgba(0, 0, 0, 0.25);
            border: 1px rgba(0, 0, 0, 0.25) solid;
            border-radius: 10px;
            padding: 10px;
            display: grid;
            grid-template-columns: 25% 25% 25% 25%;
            margin-bottom: 10px;
        }

        server-status div {
            display: block;
            position: absolute;
            background-color: rgb(56, 60, 71);
            border: 1px rgba(0, 0, 0, 0.25) solid;
            border-radius: 10px;
            padding: 5px;
            transform: translate(-16px, -16px);
            cursor: pointer;
        }

        .title-1.p {
            font-weight: bold;
            font-size: 25px;
            color: rgb(172, 172, 172);
        }

        .title-1.p a {
            font-weight: normal;
            font-size: 20px;
            color: rgb(231, 231, 231)
        }

        .title-1 {
            font-weight: bold;
            font-size: 25px;
            color: rgb(172, 172, 172);
        }

        .title-1 a {
            font-weight: normal;
            font-size: 20px;
            color: rgb(129, 144, 226)
        }

        div#refresh {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: rgba(0, 0, 0, 0.25);
            border: 1px rgba(0, 0, 0, 0.25) solid;
            border-radius: 10px;
            padding: 10px;
            cursor: pointer;
        }

        div#refresh:hover {
            background-color: rgba(0, 0, 0, 0.45);
        }
    </style>
    <main>
        <h1 style="justify-self: center;">Minecraft Server Status</h1>
        <p style="justify-self: center;">Site by Ningy | <a style="color: rgb(136, 44, 189);"
                href="https://discord.gg/GMCrXmTN54">Mythical Dawn</a></p>
        <div id="refresh">Refresh Listed Servers</div>
        <server-status ip="143.20.122.13:25567" ipLink="https://discord.gg/Hw3pxBuxFn"></server-status>
        <server-status ip="openstars.scrim.club" ipLink="https://discord.gg/Hw3pxBuxFn"></server-status>

        <script>
            async function getServerStatus() {
                const serverElements = document.querySelectorAll('server-status');
                serverElements.forEach(async (element) => {
                    const serverIP = element.getAttribute('ip');
                    const ipLink = element.getAttribute('ipLink');
                    if (!serverIP) return;
                    element.innerHTML = `
                    <div class="discord" data-dest="${ipLink}">Discord Invite</div>
                    <p>IP: <a>${serverIP}</a></p><p>Loading...</p>
                    `;
                    try {
                        const response = await fetch(`https://api.mcsrvstat.us/3/${serverIP}`);
                        const data = await response.json();

                        if (data.online) {
                            element.innerHTML = `
                        <div class="discord" data-dest="${ipLink}">Discord Invite</div>
                        <p class="title-1">IP: <a>${serverIP}</a></p>
                        <p class="title-1 p">Status: <a>Online</a></p>
                        <p class="title-1 p">Players: <a>${data.players.online} / ${data.players.max}</a></p>
                        <p class="title-1 p">MOTD: <a>${data.motd.clean.join(' ')}</a></p>
                    `;
                        } else {
                            element.innerHTML = `
                        <div class="discord" data-dest="${ipLink}">Discord Invite</div>
                        <p class="title-1">IP: <a>${serverIP}</a></p>
                        <p class="title-1 p">Status: <a>Offline</a></p>
                    `;
                        }
                    } catch (error) {
                        element.innerHTML = `<p>Error loading <a>${serverIP}</a></p>`;
                        console.error(error);
                    }
                });
            }
            getServerStatus();
            document.getElementById("refresh").addEventListener("click", function () {
                getServerStatus();
            });
            document.addEventListener("click", function (event) {
                const button = event.target.closest(".discord");

                if (button) {
                    const url = button.getAttribute("data-dest");
                    if (url) {
                        window.open(url, "_blank");
                    }
                }
            });
        </script>

    </main>
</body>

</html>
